name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxkbcommon-dev libgl1-mesa-dev libx11-xcb-dev libxcursor-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --no-fail-fast
      # The editor test opens real windows.
      - name: Test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --no-fail-fast
