name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxkbcommon-dev libgl1-mesa-dev libx11-xcb-dev libxcursor-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The bundle is universal: both architectures, whichever the runner is.
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # The runner has no GPU, so Windows offers no OpenGL 3 context for the editor; Mesa's llvmpipe does.
      - name: OpenGL for the editor test
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0
        with:
          version: "26.0.3"
          build-type: release-msvc
          deployment-choice: "1"
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy for Intel macOS
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin -- -D warnings
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --no-fail-fast
        env:
          PLUGIN_FORMAT_NO_GL: ${{ runner.os == 'macOS' && 'the arm64 macOS runner has no hardware OpenGL, which baseview requires' || '' }}
      # The editor test opens real windows.
      - name: Test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --no-fail-fast
      - name: Bundle
        shell: bash
        run: |
          scripts/bundle.sh gain Gain com.plugin-format.gain bundles/gain
          scripts/bundle.sh sidechain Sidechain com.plugin-format.sidechain bundles/sidechain
          find bundles
      # Both validators are built from source on first use, which takes minutes. They are saved even when
      # validation fails, so a failing plugin does not rebuild them on every run, but only once both are built.
      - name: Restore validators
        id: validators
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/validators
          key: validators-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/validators.env') }}
      - name: Validate
        shell: bash
        env:
          VALIDATORS_DIR: ${{ runner.temp }}/validators
        run: scripts/validate.sh bundles/gain
      - name: Validators built
        id: built
        if: always() && steps.validators.outputs.cache-hit != 'true'
        shell: bash
        env:
          VALIDATORS_DIR: ${{ runner.temp }}/validators
        run: if [ -e "$VALIDATORS_DIR/.complete" ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save validators
        if: always() && steps.built.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/validators
          key: ${{ steps.validators.outputs.cache-primary-key }}
