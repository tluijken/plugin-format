[package]
name = "plugin-format"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CLAP and VST3 export for a plugin written once against a small trait, with an egui editor"
publish = false

[lib]
name = "plugin_format"

[workspace]
resolver = "3"
members = ["examples/gain", "examples/sidechain"]

[dependencies]
clap-sys = "0.5"
# The same egui egui-baseview renders with, for the default fonts egui-baseview leaves out.
egui = "0.37"
# "log" because 0.9 does not build without a logging feature.
egui-baseview = { version = "0.9", default-features = false, features = ["opengl", "log"] }
raw-window-handle = "0.6"
vst3 = "0.3"

# The host tests load the example's library, so building it is part of testing this crate.
[dev-dependencies]
gain = { path = "examples/gain" }
sidechain = { path = "examples/sidechain" }
clap-sys = "0.5"
libloading = "0.8"
serde_json = "1"
vst3 = "0.3"

# A parent window for the editor test, and the process's threads on Windows.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "objc2-core-foundation"] }

# AppKit opens windows on the main thread only, which the test harness keeps for itself.
[[test]]
name = "editor"
harness = false
